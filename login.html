<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - World Cup Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl p-8 shadow-xl border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-amber-500 tracking-wide uppercase">🔑 LOG IN USER</h1>
            <p class="text-slate-400 text-sm mt-1">Masuk untuk mulai menebak skor pertandingan!</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" required placeholder="nama@email.com" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-amber-500 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 focus:outline-none focus:border-amber-500 text-white text-sm">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-lg transition shadow-lg cursor-pointer text-sm mt-2">
                Masuk ke Akun
            </button>
        </form>

        <p class="text-sm text-slate-400 text-center mt-6">
            Belum punya akun? <a href="register.html" class="text-amber-400 hover:underline font-medium">Daftar di sini</a>
        </p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('🔥 ' + result.message);
                    // Menyimpan data user asli hasil login ke localStorage
                    localStorage.setItem('user', JSON.stringify(result.user));
                    // Redirect ke halaman utama tebak skor
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Gagal: ' + result.error);
                }
            } catch (error) {
                alert('Terjadi kesalahan koneksi server.');
            }
        });
    </script>
</body>
</html>
